* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a3a6b 0%, #2e7fc2 45%, #7fb2e0 75%, #c62828 130%);
  background-attachment: fixed;
  color: #1f2937;
  padding: 24px 12px 80px;
}
.glass {
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 20px;
  box-shadow: 0 10px 32px rgba(15, 40, 80, 0.22);
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.karte { padding: 26px 28px; }
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.titel { font-family: 'Yu Gothic', 'Yu Gothic UI', 'Segoe UI', 'Hiragino Sans', sans-serif; font-size: 20px; font-weight: 400; letter-spacing: 0.5px; color: #1f2937; }
.titel .L { color: #1d4ed8; font-weight: 700; }
.titel .S { color: #ea580c; font-weight: 700; }
.untertitel { margin-top: 2em; font-size: 15px; color: #1f2937; letter-spacing: 1px; }
.logo svg { width: 94px; height: 94px; display: block; filter: drop-shadow(0 4px 10px rgba(15,40,80,.25)); }
#countdownLeiste {
  display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 500; padding: 10px 26px; align-items: center; gap: 14px;
  font-family: 'Courier New', Courier, monospace; font-size: 25px; font-weight: 700; color: #1a3a6b;
}
#countdownLeiste.laeuft { display: flex; }
.cdLabel { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; letter-spacing: 2px; color: #3b4a63; font-weight: 600; }
#foerderZeit { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; color: #0c5c2e; }
#countdownLeiste.warn-gelb { background: rgba(254, 243, 199, 0.85); border-color: #f59e0b; color: #92400e; }
#countdownLeiste.warn-orange { background: rgba(255, 224, 178, 0.9); border-color: #f97316; color: #9a3412; }
#countdownLeiste.warn-rot { background: rgba(254, 202, 202, 0.92); border-color: #dc2626; color: #991b1b; animation: puls 1s infinite; }
@keyframes puls { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
.feldLabel { display: block; font-size: 13px; font-weight: 600; color: #3b4a63; margin: 14px 0 5px; }
input[type=text], input:not([type]), select, textarea {
  width: 100%; padding: 11px 13px; font-size: 15px; border-radius: 12px;
  border: 1px solid rgba(26, 58, 107, 0.35); background: rgba(255,255,255,0.75);
  color: #1f2937; outline: none; transition: box-shadow .15s, border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: #2e7fc2; box-shadow: 0 0 0 3px rgba(46,127,194,.25); }
input:disabled, select:disabled { background: rgba(226,232,240,.7); color: #64748b; cursor: not-allowed; }
.dreiFelder { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.aktionsZeile { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  border: none; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 700;
  cursor: pointer; color: #fff; background: #2e7fc2; transition: transform .12s, box-shadow .12s, opacity .12s;
  box-shadow: 0 4px 14px rgba(15,40,80,.25);
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15,40,80,.3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-gruen { background: #15803d; }
.btn-rot { background: #c62828; }
.btn-grau { background: #64748b; }
.sperrHinweis { color: #b91c1c; font-weight: 700; }
#pwHinweis { margin-top: 8px; font-size: 14px; }
.hinweis { font-size: 13px; color: #4b5b76; margin-top: 4px; }
.abschnitt h3 { font-size: 20px; color: #1a3a6b; border-bottom: 3px solid rgba(46,127,194,.4); padding-bottom: 6px; margin-top: 10px; }
.aufgabe { padding: 20px 22px; margin-bottom: 16px; }
.aufgKopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.aufgTitel { font-weight: 700; font-size: 17px; color: #1a3a6b; }
.pkte { background: rgba(46,127,194,.15); color: #1a3a6b; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.aufgText { line-height: 1.55; }
.aufgText p { margin: 6px 0; }
.aufgText label { display: inline-block; margin: 3px 14px 3px 0; }
.uebersetzung { font-style: italic; color: #6b7280; font-size: 0.9rem; margin-top: 8px; border-left: 3px solid rgba(46,127,194,.5); padding-left: 10px; }
.eingabeZone { margin-top: 12px; }
.eingabeZone input { max-width: 260px; }
.bruchEingabe { display: inline-flex; flex-direction: column; width: 110px; gap: 4px; }
.bruchEingabe .bruchStrich { height: 3px; background: #1a3a6b; border-radius: 2px; }
.br { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; margin: 0 3px; line-height: 1.15; }
.br .bz { border-bottom: 2px solid currentColor; padding: 0 7px; }
.br .bn { padding: 0 7px; }
.br.blau { color: #1d4ed8; font-weight: 700; }
.gK { display: inline-block; background: #fff; border: 1px solid rgba(26,58,107,.4); border-radius: 8px; padding: 1px 7px; margin-right: 2px; font-weight: 700; vertical-align: middle; }
.klein { font-size: 12px; }
.hell { color: #6b7280; }
.wortbank { background: rgba(255,255,255,.75); border: 1px dashed rgba(26,58,107,.5); border-radius: 12px; padding: 10px 14px; font-weight: 600; color: #1a3a6b; }
.farbe-dunkelgruen { border-left: 10px solid #14532d; }
.farbe-gruen { border-left: 10px solid #16a34a; }
.farbe-orange { border-left: 10px solid #f97316; }
.farbe-gelb { border-left: 10px solid #eab308; }
.farbe-rot { border-left: 10px solid #dc2626; }
.detailKarte { padding: 14px 18px; margin-bottom: 12px; }
.detailKopf { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; color: #1a3a6b; }
.detailAntwort { font-size: 13px; color: #4b5b76; margin-top: 4px; word-break: break-word; }
.musterBox { background: rgba(254, 249, 195, .9); border: 1px solid #eab308; border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: 14px; }
.ergKarte { position: relative; }
.ergKopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.ergZeile { font-size: 15px; margin: 3px 0; }
.ergBewertung { font-size: 20px; margin-top: 10px; color: #1a3a6b; }
.modalHintergrund { display: none; position: fixed; inset: 0; background: rgba(15, 30, 60, .45); z-index: 900; align-items: center; justify-content: center; padding: 16px; }
.modalHintergrund.aktiv { display: flex; }
.modal { max-width: 520px; width: 100%; padding: 26px 28px; }
.modal h3 { color: #1a3a6b; margin-bottom: 10px; }
.btnReihe { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
#toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  padding: 12px 22px; font-weight: 600; color: #1a3a6b; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 950;
}
#toast.sichtbar { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.warnung { border: 3px solid #dc2626; color: #991b1b; background: rgba(254, 226, 226, 0.95); }
/* Kurs-Farben am Kursfeld: EK rot, GK grün, V blau */
#kursFeld.kurs-EK { border: 3px solid #dc2626; }
#kursFeld.kurs-GK { border: 3px solid #16a34a; }
#kursFeld.kurs-V  { border: 3px solid #1d4ed8; }
/* Kopierschutz: nur während der laufenden Arbeit, nur Aufgabenbereich */
#testBereich.schutz { -webkit-user-select: none; -moz-user-select: none; user-select: none; }
#testBereich.schutz input, #testBereich.schutz textarea, #testBereich.schutz select {

svg { max-width: 100%; height: auto; }
@media print {
  body { background: #fff; padding: 0; }
  #countdownLeiste, .aktionsZeile, .btn, #toast, .modalHintergrund { display: none !important; }
  .glass { background: #fff; border: 1px solid #ccc; box-shadow: none; backdrop-filter: none; }
  .aufgabe, .detailKarte, .karte { break-inside: avoid; }
}

<div id="countdownLeiste" class="glass" role="timer" aria-live="polite">

        <input type="text" id="klasseFeld" disabled placeholder="wird ermittelt">

    <div class="aktionsZeile">

    </div>
  </div>

  <div id="testBereich" style="display:none;">
    <div class="karte glass">

    </div>
  </div>

  <div id="ergebnisBereich" style="display:none;"></div>
</div>

<div class="modalHintergrund" id="abgabeModal">
  <div class="modal glass">
    <h3>Abgabe bestätigen</h3>
    <p id="abgabeText"></p>
    <div class="btnReihe">
      <button class="btn btn-rot" id="trotzdemBtn">Trotzdem abgeben</button>
      <button class="btn btn-grau" id="zurueckBtn">Doch nicht abgeben</button>
    </div>
  </div>
</div>

<div id="toast" class="glass"></div>

/* ===== MC-Hilfen ===== */
function mc1Check(eingabe, optionen, richtigIdx) {
  if (optionen) LETZTE_LOESUNGEN.push(optionen[richtigIdx]);
  return parseInt(eingabe, 10) === richtigIdx ? 1 : 0;
}
function mcxCheck(gewaehlt, richtige) {
  LETZTE_LOESUNGEN.push('Auswahl Nr. ' + richtige.map(function (i) { return i + 1; }).join(', '));
  const g = (gewaehlt || []).slice().sort().join(',');
  const r = richtige.slice().sort().join(',');
  return g === r ? 1 : 0;
}

function renderAufgabe(a, idx) {

    .replace(/id="f/g, 'id="' + pre + 'f')

    .replace(/for="f/g, 'for="' + pre + 'f');
  let eingabe = '';
  if (a.typ === 'zahl') eingabe = '<input id="' + pre + 'f0" inputmode="decimal" autocomplete="off" placeholder="Antwort">';
  else if (a.typ === 'text') eingabe = '<input id="' + pre + 'f0" autocomplete="off" placeholder="Antwort">';
  else if (a.typ === 'frei') eingabe = '<textarea id="' + pre + 'f0" rows="3" placeholder="Deine Antwort …"></textarea>';
  else if (a.typ === 'bruch') eingabe = '<div class="bruchEingabe"><input id="' + pre + 'f0z" inputmode="numeric" placeholder="Zähler"><span class="bruchStrich"></span><input id="' + pre + 'f0n" inputmode="numeric" placeholder="Nenner"></div>';
  if (a.weg) eingabe += '<textarea id="' + pre + 'weg" rows="2" placeholder="Rechenweg (Pflicht) …"></textarea>';
  let uebersetzung = '';
  if (state.sprache && a.uebersetzungen && a.uebersetzungen[state.sprache]) {
    const praefix = state.sprache === 'en' ? 'English: ' : 'Español: ';
    uebersetzung = '<div class="uebersetzung">' + praefix + a.uebersetzungen[state.sprache] + '</div>';
  }
  d.innerHTML = '<div class="aufgKopf"><span class="aufgTitel">' + a.titel + '</span><span class="pkte">' + formatPunkte(a.punkte) + ' P</span></div>'
    + '<div class="aufgText">' + html + '</div>' + uebersetzung + '<div class="eingabeZone">' + eingabe + '</div>';
  return d;
}
function sammleWerte(karte, idx) {
  const pre = 'q' + idx + '_';
  const v = {};
  karte.querySelectorAll('input[type=radio]:checked').forEach(function (el) {
    v[el.name.slice(pre.length)] = el.value;
  });
  const cb = {};
  karte.querySelectorAll('input[type=checkbox]:checked').forEach(function (el) {
    const k = el.name.slice(pre.length);
    if (!cb[k]) cb[k] = [];
    cb[k].push(el.value);
  });
  Object.keys(cb).forEach(function (k) { v[k] = cb[k]; });
  karte.querySelectorAll('input:not([type=radio]):not([type=checkbox]), textarea, select').forEach(function (el) {
    if (el.id && el.id.indexOf(pre) === 0) v[el.id.slice(pre.length)] = el.value;
  });
  return v;
}
function antwortText(v) {
  const keys = Object.keys(v).filter(function (k) { return k !== 'weg'; }).sort();
  return keys.map(function (k) { return Array.isArray(v[k]) ? v[k].join(', ') : v[k]; })
    .filter(function (s) { return String(s).trim() !== ''; }).join(' | ');
}

/* ===== Bewertung ===== */
function farbeFuer(proz) {
  if (proz >= 90) return 'farbe-dunkelgruen';
  if (proz >= 65) return 'farbe-gruen';
  if (proz >= 45) return 'farbe-orange';
  if (proz >= 15) return 'farbe-gelb';
  return 'farbe-rot';
}
const NOTEN = { GK: [85, 77, 67, 40, 20], EK: [90, 80, 72, 45, 25], V: [87, 78, 70, 42, 22] };
function noteAusProzent(p, kurs) {
  const g = NOTEN[kurs] || NOTEN.V;
  if (p >= g[0]) return '1';
  if (p < g[4]) return '6';
  for (let i = 1; i <= 4; i++) {
    if (p >= g[i]) {
      const note = i + 1;
      const w = g[i - 1] - g[i];
      let tendenz = '';
      if (p >= g[i] + 2 * w / 3) tendenz = '+';
      else if (p < g[i] + w / 3) tendenz = '−';
      return String(note) + tendenz;
    }
  }
  return '6';
}
function istVermerk(lzkName) {
  return /^(übung|testvorbereitung)/i.test(lzkName.trim());
}
function vermerkText(proz, details) {
  let satz;
  if (proz >= 85) satz = 'Sehr gut gemacht — das Thema hast du sicher verstanden!';
  else if (proz >= 60) satz = 'Das hast du schon gut gemacht. Übe noch die Aufgaben, bei denen du Fehler hattest.';
  else if (proz >= 40) satz = 'Einiges hast du schon geschafft, aber da musst du noch üben. Schau dir dazu die Musterlösung an.';
  else satz = 'Da musst du noch üben. Bearbeite die Aufgaben mithilfe der Musterlösung noch einmal.';
  const fehler = details.filter(function (d) { return d.proz < 100; }).map(function (d) { return d.titel; });
  let txt = 'Leistungsvermerk: <b>' + satz + '</b>';
  if (fehler.length) txt += '<br>Das musst du noch üben: ' + fehler.join('; ');
  return txt;
}
function rueckmeldungText(proz, erzielt, max) {
  let satz;
  if (proz >= 85) satz = 'Hervorragende Leistung – weiter so!';
  else if (proz >= 60) satz = 'Gute Arbeit – mit etwas Übung wird es noch besser.';
  else if (proz >= 40) satz = 'Du hast die Grundlagen teilweise verstanden. Übe die markierten Aufgaben weiter.';
  else satz = 'Lass dich nicht entmutigen – schau dir die Lösungen an und sprich gern mit mir.';
  return 'Individuelle Rückmeldung: Du hast <b>' + formatPunkte(erzielt) + ' von ' + formatPunkte(max) + ' Punkten</b> erreicht (' + formatPunkte(proz) + ' %). ' + satz;
}
function bewerten() {
  const details = [];
  let erzielt = 0, max = 0, nr = 0;
  state.aufgaben.forEach(function (a, idx) {
    if (a.typ === 'abschnitt') return;
    nr++;
    const karte = document.querySelector('[data-ai="' + idx + '"]');
    const v = karte ? sammleWerte(karte, idx) : {};
    LETZTE_LOESUNGEN = [];
    const res = a.check(v);
    const aufgezeichnet = LETZTE_LOESUNGEN.slice();
    let p = 0, feedback = '';
    if (typeof res === 'number') {
      let anteil = res;
      if (a.weg && res === 1 && !String(v.weg || '').trim()) {
        anteil = 0.5;
        feedback = 'Endergebnis richtig, aber Rechenweg fehlt bzw. ist nicht ausreichend dargestellt (50 % der Punkte).';
      }
      p = Math.round(anteil * a.punkte * 100) / 100;
      if (!feedback) feedback = (res === 1) ? 'Vollständig richtig.' : 'Antwort falsch oder keine Eingabe.';
    } else if (res && typeof res === 'object') {
      Object.keys(res).forEach(function (k) { p += res[k][0]; });
      p = Math.round(p * 100) / 100;
      const ratio = a.punkte ? p / a.punkte : 0;
      if (Math.abs(ratio - 0.85) < 0.001) feedback = 'Wert richtig, nicht vollständig gekürzt (85 % der Punkte).';
      else if (p >= a.punkte) feedback = 'Vollständig richtig.';
      else if (p > 0) feedback = 'Teilweise richtig.';
      else feedback = 'Antwort falsch oder keine Eingabe.';
    }
    erzielt += p; max += a.punkte;
    const proz = a.punkte ? (p / a.punkte) * 100 : 0;
    const farbe = farbeFuer(proz);
    const musterHtml = a.loesungHtml
      || (aufgezeichnet.length ? 'Richtige Lösung: <b>' + aufgezeichnet.join(' &nbsp;|&nbsp; ') + '</b>' : '');
    details.push({
      nr: nr,
      titel: a.titel,
      frage: stripHtml(a.html).replace(/\s+/g, ' ').trim(),
      typ: a.typ,
      schuelerAntwort: antwortText(v),
      antwort: antwortText(v),
      feedback: feedback,
      musterloesung: stripHtml(musterHtml).replace(/\s+/g, ' ').trim(),
      musterloesungHtml: musterHtml,
      punkte: p,
      maxPunkte: a.punkte,
      max: a.punkte,
      proz: proz,
      farbe: farbe,
      fundamentum: /^Fundamentum/.test(a.titel)
    });
  });
  const proz = max ? (erzielt / max) * 100 : 0;
  const erg = { erzielt: erzielt, max: max, proz: proz, details: details,
    gesamtPunkte: erzielt, maxPunkte: max };
  if (state.leModus) {
    erg.bewertungHtml = rueckmeldungText(proz, erzielt, max);
    erg.note = stripHtml(erg.bewertungHtml);
    erg.noteKurz = '';
  } else if (istVermerk(state.lzkName)) {
    erg.bewertungHtml = vermerkText(proz, details);
    erg.note = stripHtml(erg.bewertungHtml);
    erg.noteKurz = '';
  } else {
    const n = noteAusProzent(proz, state.kurs);
    erg.note = n;
    erg.noteKurz = n;
    erg.bewertungHtml = 'Note: <b>' + n + '</b>';
  }
  return erg;
}

/* ===== Anmeldeablauf mit Sperrlogik ===== */
function $(id) { return document.getElementById(id); }
let letzterGepruefterWert = '';
function sperrRestMs() {
  const bis = parseInt(localStorage.getItem('ltw_pw_lockuntil') || '0', 10);
  return Math.max(0, bis - Date.now());
}
function zeigeSperre() {
  const rest = sperrRestMs();
  const h = $('pwHinweis');
  if (rest > 0) {
    h.style.display = 'block';
    h.textContent = 'Zu viele Fehlversuche. Nächster Versuch in ' + Math.ceil(rest / 1000) + ' s möglich.';
    $('pwFeld').disabled = true;
    setTimeout(zeigeSperre, 500);
  } else if (!state.angemeldet) {
    $('pwFeld').disabled = false;
    h.style.display = 'none';
  }
}
function pruefePasswort() {
  const wert = $('pwFeld').value.trim().toUpperCase();
  if (!wert || wert === letzterGepruefterWert || state.angemeldet) return;
  letzterGepruefterWert = wert;
  if (sperrRestMs() > 0) { zeigeSperre(); return; }
  const s = SCHUELER[wert];
  if (s) {
    state.angemeldet = true;
    state.name = s.name;
    state.eintraege = s.eintraege;
    const f = FOERDERUNG[s.name];
    if (f) {
      state.extraMin = f.extraMin || 0;
      if (f.sprache) state.sprache = f.sprache;
      if (f.le) state.leModus = true;
    }
    localStorage.setItem('ltw_pw_fails', '0');
    localStorage.removeItem('ltw_pw_lockuntil');
    $('pwFeld').value = s.name; // SVERWEIS: Name ersetzt das Passwort
    $('pwFeld').disabled = true;
    $('pwHinweis').style.display = 'none';
    showToast('Angemeldet: ' + s.name);
    eintraegeVerarbeiten();
  } else {
    const fails = parseInt(localStorage.getItem('ltw_pw_fails') || '0', 10) + 1;
    localStorage.setItem('ltw_pw_fails', String(fails));
    const h = $('pwHinweis');
    h.style.display = 'block';
    if (fails >= 3) {
      const dauer = 15000 * Math.pow(2, fails - 3);
      localStorage.setItem('ltw_pw_lockuntil', String(Date.now() + dauer));
      h.textContent = 'Passwort falsch. Sperre für ' + Math.round(dauer / 1000) + ' s.';
      zeigeSperre();
    } else {
      h.textContent = 'Passwort falsch. Noch ' + (3 - fails) + ' freie(r) Versuch(e), dann greift eine Sperre.';
    }
  }
}
function eintraegeVerarbeiten() {
  const faecher = [];

  if (faecher.length === 1) {

    });

function fachGewaehlt(fach) {

  const gesamt = state.aufgaben.reduce(function (s, a) { return s + a.punkte; }, 0);
  $('testInfo').textContent = state.name + ' · ' + state.fach + ' · Klasse ' + state.klasse
    + (state.kurs !== 'V' ? ' (' + state.kurs + ')' : '') + ' · ' + formatPunkte(gesamt) + ' Punkte';
  const liste = $('aufgabenListe');
  liste.innerHTML = '';
  state.aufgaben.forEach(function (a, i) { liste.appendChild(renderAufgabe(a, i)); });
  const nAufg = state.aufgaben.filter(function (a) { return a.typ !== 'abschnitt'; }).length;
  let minuten = nAufg * minutenProAufgabe(state.fach);
  if (state.extraMin) {
    $('foerderZeit').textContent = '(+ ' + state.extraMin + ' Min Förderbedarf)';
    minuten += state.extraMin;
  } else {
    $('foerderZeit').textContent = '';
  }
  state.restSekunden = minuten * 60;
  starteCountdown();
  window.scrollTo(0, 0);
}
function countdownAnzeige() {
  const m = Math.floor(state.restSekunden / 60), s = state.restSekunden % 60;
  $('countdownZeit').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  const leiste = $('countdownLeiste');
  leiste.classList.remove('warn-gelb', 'warn-orange', 'warn-rot');
  if (state.restSekunden <= 90) leiste.classList.add('warn-rot');
  else if (state.restSekunden <= 140) leiste.classList.add('warn-orange');
  else if (state.restSekunden <= 200) leiste.classList.add('warn-gelb');
}
function starteCountdown() {
  const leiste = $('countdownLeiste');
  leiste.classList.add('laeuft');
  countdownAnzeige();
  clearInterval(state.timerId);
  state.timerId = setInterval(function () {
    state.restSekunden--;
    countdownAnzeige();
    if (state.restSekunden <= 0) {
      clearInterval(state.timerId);
      abgeben(true);
    }
  }, 1000);
}
function anzahlUnbearbeitet() {
  let n = 0;
  state.aufgaben.forEach(function (a, idx) {
    if (a.typ === 'abschnitt') return;
    const karte = document.querySelector('[data-ai="' + idx + '"]');
    if (!karte) return;
    if (!antwortText(sammleWerte(karte, idx))) n++;
  });
  return n;
}

/* ===== Abgabe ===== */
function abgeben(automatisch) {
  if (!state.testLaeuft) return;
  if (automatisch) { abgabeAbschliessen(); return; }
  const offen = anzahlUnbearbeitet();
  $('abgabeText').textContent = offen > 0
    ? 'Es sind noch ' + offen + ' Aufgabe(n) unbearbeitet. Unbearbeitete Aufgaben werden mit 0 Punkten gewertet. Wirklich abgeben?'
    : 'Alle Aufgaben sind bearbeitet. Jetzt endgültig abgeben?';
  $('abgabeModal').classList.add('aktiv');
}
function abgabeAbschliessen() {
  $('abgabeModal').classList.remove('aktiv');
  if (!state.testLaeuft) return;
  state.testLaeuft = false;
  clearInterval(state.timerId);
  const ergebnis = bewerten();
  $('testBereich').classList.remove('schutz');
  $('testBereich').style.display = 'none';
  $('countdownLeiste').classList.remove('laeuft');
  sessionStorage.setItem('ltw_gesperrt', '1');
  zeigeErgebnis(ergebnis);
  sendeAnGoogleSheets(ergebnis);
}

/* ===== Ergebnisansicht ===== */
function zeigeErgebnis(erg) {
  const bereich = $('ergebnisBereich');
  bereich.style.display = 'block';
  let h = '<div class="karte glass ergKarte">'
    + '<div class="ergKopf"><div>'
    + '<div class="ergZeile"><b>' + state.name + '</b> / ' + state.fach + ' / ' + state.klasse + ' (' + state.kurs + ')</div>'
    + '<div class="ergZeile">' + state.lzkName + '</div>'
    + '<div class="ergZeile">Punkte: <b>' + formatPunkte(erg.erzielt) + ' von ' + formatPunkte(erg.max) + '</b> / ' + formatPunkte(erg.proz) + ' %' + (erg.noteKurz ? ' / <b>Note: ' + erg.noteKurz + '</b>' : '') + '</div>'
    + '<div class="ergBewertung">' + erg.bewertungHtml + '</div>'
    + '</div><div class="logo" id="logoErg"></div></div>'
    + '<div class="aktionsZeile"><button class="btn" id="pdfBtn">Ergebnis als PDF speichern</button></div>'
    + '</div>';
  h += '<div class="abschnitt"><h3>Auswertung im Detail</h3></div>';
  erg.details.forEach(function (d) {
    h += '<div class="detailKarte glass ' + d.farbe + '">'
      + '<div class="detailKopf"><span>' + d.titel + '</span><span>' + formatPunkte(d.punkte) + ' / ' + formatPunkte(d.max) + ' P</span></div>'
      + '<div class="detailAntwort">Deine Antwort: ' + (d.antwort ? String(d.antwort) : '<i>keine Angabe</i>') + '</div>'
      + '<div class="detailAntwort"><i>' + d.feedback + '</i></div>';
    if (d.musterloesungHtml) {
      h += '<div class="musterBox">Musterlösung: ' + d.musterloesungHtml + '</div>';
    } else if (d.fundamentum) {
      h += '<div class="musterBox">Musterlösung: Wird in der Besprechung gezeigt.</div>';
    }
    h += '</div>';
  });
  bereich.innerHTML = h;
  $('logoErg').innerHTML = LOGO_SVG;
  $('pdfBtn').addEventListener('click', function () { erstellePDF(erg); });
  window.scrollTo(0, 0);
}

/* ===== Übermittlung an Google Sheets (Version laut Anweisung) ===== */
function sendeAnGoogleSheets(ergebnis) {
  const url = 'https://script.google.com/macros/s/AKfycbwoTwjjQTMyyzx6dO-yACDC4StbTpYyR8wcRyFlLiUXvUvcrqPDdQBlubIC2bst6XpWYQ/exec';
  if (!state.kurs) {
    console.warn('Kein Kurs ermittelt – Anmeldung unvollständig.');
  }
  const detailsArray = ergebnis.details.map(d => ({
    nr: d.nr,
    frage: d.frage,
    typ: d.typ,
    antwort: d.schuelerAntwort,
    feedback: d.feedback,
    musterloesung: d.musterloesung,
    punkte: d.punkte,
    maxPunkte: d.maxPunkte,
    farbe: d.farbe
  }));
  // URLSearchParams sendet automatisch als application/x-www-form-urlencoded
  // -> Werte sind im Google-Script über e.parameter auslesbar
  const params = new URLSearchParams();
  params.append('zeitstempel', new Date().toISOString());
  params.append('name', state.name);
  params.append('fach', state.fach);
  params.append('klasse', state.klasse);
  params.append('kurs', state.kurs);
  params.append('lzk', state.lzkName);
  params.append('punkte', formatPunkte(ergebnis.gesamtPunkte) + ' / ' + ergebnis.maxPunkte);
  params.append('note', String(ergebnis.note));
  params.append('details', JSON.stringify(detailsArray));
  params.append('pdfname', (state.name + '_' + state.lzkName + '.pdf').replace(/\s+/g, '_'));
  console.log('=== Sende an Google ===');
  fetch(url, { method: 'POST', body: params })
    .then(response => response.text())
    .then(data => { console.log('Antwort:', data); })
    .catch(err => {
      console.error('Fehler:', err);
      showToast('Ergebnis konnte nicht gespeichert werden.');
    });
}

/* ===== Kopierschutz während der schriftlichen Arbeit ===== */
function kopierWarnung() {
  showToast('Während der schriftlichen Arbeit ist das Kopieren der Aufgaben nicht erlaubt!', true);
}
['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    if (!state.testLaeuft) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return; // Eingabefelder bleiben frei
    e.preventDefault();
    kopierWarnung();
  });
});
document.addEventListener('keydown', function (e) {
  if (!state.testLaeuft) return;
  const k = (e.key || '').toLowerCase();
  if (!(e.ctrlKey || e.metaKey)) return;
  if (k !== 'c' && k !== 'x' && k !== 'p' && k !== 's') return;
  const t = e.target;
  const imFeld = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (imFeld && (k === 'c' || k === 'x')) return; // Markieren/Kopieren im eigenen Eingabefeld erlaubt
  e.preventDefault();
  kopierWarnung();
});

/* ===== PDF-Auswertung (jsPDF) ===== */
function pdfText(s) {
  return String(s == null ? '' : s)
    .replace(/\u2212/g, '-').replace(/\u00b7/g, '*').replace(/\u2219/g, '*')
    .replace(/\u221a/g, 'Wurzel ').replace(/\u221b/g, '3. Wurzel ')
    .replace(/\u2248/g, 'ca. ').replace(/\u00b2/g, '^2').replace(/\u00b3/g, '^3')
    .replace(/\u03c0/g, 'pi').replace(/\u2013/g, '-').replace(/\u2014/g, '-')
    .replace(/\u201e|\u201c|\u201d/g, '"').replace(/\u2018|\u2019/g, "'")
    .replace(/[^\u0020-\u007e\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df\u20ac\u00b0]/g, ' ');
}
function logoPng(breitePx, cb) {
  try {
    const img = new Image();
    img.onload = function () {
      const c = document.createElement('canvas');
      c.width = breitePx; c.height = breitePx;
      c.getContext('2d').drawImage(img, 0, 0, breitePx, breitePx);
      cb(c.toDataURL('image/png'));
    };
    img.onerror = function () { cb(null); };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(LOGO_SVG)));
  } catch (e) { cb(null); }
}
function erstellePDF(erg) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    showToast('PDF-Bibliothek nicht geladen. Bitte Internetverbindung prüfen.');
    return;
  }
  logoPng(400, function (logo) {
    const doc = new window.jspdf.jsPDF('p', 'mm', 'a4');
    const seitenBreite = 210, rand = 15, maxBreite = seitenBreite - 2 * rand;
    let y = 0;
    function logoRechts(mm) { if (logo) doc.addImage(logo, 'PNG', seitenBreite - rand - mm, 10, mm, mm); }
    function zeile(txt, groesse, fett, abstand) {
      doc.setFontSize(groesse);
      doc.setFont('helvetica', fett ? 'bold' : 'normal');
      const zeilen = doc.splitTextToSize(pdfText(txt), maxBreite);
      if (y + zeilen.length * groesse * 0.45 > 282) { doc.addPage(); y = 20; logoRechts(25); }
      doc.text(zeilen, rand, y);
      y += zeilen.length * groesse * 0.45 + (abstand || 2);
    }
    /* Deckblatt: Logo größer (oben rechts) */
    logoRechts(45);
    y = 30;
    zeile('LernSpeicher – Auswertung', 18, true, 6);
    zeile(state.name + ' / ' + state.fach + ' / ' + state.klasse + ' (' + state.kurs + ')', 12, false, 2);
    zeile(state.lzkName, 12, false, 2);
    zeile('Punkte: ' + formatPunkte(erg.erzielt) + ' von ' + formatPunkte(erg.max) + ' / ' + formatPunkte(erg.proz) + ' %' + (erg.noteKurz ? ' / Note: ' + erg.noteKurz : ''), 12, true, 6);
    zeile(stripHtml(erg.bewertungHtml), 11, false, 8);
    zeile('Datum: ' + new Date().toLocaleString('de-DE'), 10, false, 0);
    /* Detailseiten: Logo 25 mm oben rechts auf jeder Seite */
    doc.addPage(); y = 20; logoRechts(25);
    zeile('Auswertung im Detail', 14, true, 6);
    erg.details.forEach(function (d) {
      zeile(d.titel + '  –  ' + formatPunkte(d.punkte) + ' / ' + formatPunkte(d.maxPunkte) + ' P', 11, true, 1);
      zeile('Deine Antwort: ' + (d.schuelerAntwort || 'keine Angabe'), 10, false, 1);
      zeile(d.feedback, 9, false, 1);
      if (d.musterloesung) zeile('Musterlösung: ' + d.musterloesung, 9, false, 4);
      else zeile('', 4, false, 3);
    });
    doc.save((state.name + '_' + state.lzkName + '.pdf').replace(/\s+/g, '_'));
  });
}

/* ===== Ereignisse und Initialisierung ===== */
window.addEventListener('beforeunload', function (e) {
  if (state.testLaeuft) {
    e.preventDefault();
    e.returnValue = '';
  }
});
document.addEventListener('DOMContentLoaded', function () {
  $('logoKopf').innerHTML = LOGO_SVG;
  if (sessionStorage.getItem('ltw_gesperrt') === '1') {
    $('anmeldeKarte').style.display = 'none';
    $('sperrKarte').style.display = 'block';
    return;
  }
  zeigeSperre();
  $('pwFeld').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); pruefePasswort(); } });
  $('pwFeld').addEventListener('blur', pruefePasswort);
  $('pwFeld').addEventListener('input', function () { letzterGepruefterWert = ''; });
  $('fachFeld').addEventListener('change', function () { if (this.value) fachGewaehlt(this.value); });
  $('lzkFeld').addEventListener('change', pruefeStart);
  $('startBtn').addEventListener('click', starteTest);
  $('startBtn').parentElement.addEventListener('click', function () {
    if ($('startBtn').disabled) showToast('Bitte zuerst Passwort eingeben, Fach und freigegebene LZK wählen.');
  });
  $('abgebenBtn').addEventListener('click', function () { abgeben(false); });
  $('trotzdemBtn').addEventListener('click', abgabeAbschliessen);
  $('zurueckBtn').addEventListener('click', function () { $('abgabeModal').classList.remove('aktiv'); });
});
</script>
